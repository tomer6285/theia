packages:
  - 'packages/*'
  - 'apps/*'
  - 'services/*'

allowBuilds:
  electron: true
  esbuild: true

overrides:
  'postcss@>=8 <8.5.23': '^8.5.23'
  'node-forge@>=1 <1.4.1': '^1.4.1'
  'tar@>=6 <7.5.21': '^7.5.21'
  '@xmldom/xmldom@<0.8.15': '^0.8.15'
  'query-string@7>decode-uri-component': '^0.5.1'

# Expo Router 4's vendored navigation helpers import these undeclared packages.
packageExtensions:
  'expo-router@4':
    dependencies:
      query-string: '^7.1.3'
      escape-string-regexp: '^4.0.0'
      nanoid: '^3.3.11'
      fast-deep-equal: '^3.1.3'
      use-latest-callback: '^0.2.1'

patchedDependencies:
  query-string@7.1.3: patches/query-string@7.1.3.patch
